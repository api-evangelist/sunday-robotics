name: Sunday Robotics
description: 'Sunday Robotics is a consumer robotics company building Memo, an autonomous
  home robot that handles household chores such as clearing dishes, loading the dishwasher,
  pulling espresso shots, and folding laundry. The robot is trained on human demonstrations
  captured with the company''s proprietary Skill Capture Glove and runs on the ACT family
  of robot foundation models. Founded as a physical-AI company and backed by Bain Capital
  Ventures, Sunday is pre-launch with a beta program opening in late 2026. As of this
  profile the company publishes no public API, developer portal, SDK, or technical
  documentation; this record captures its public web and security surface only.'
